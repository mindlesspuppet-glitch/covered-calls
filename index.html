<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Covered Calls</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1a1a; --surface: #242424; --surface-hover: #2a2a2a;
    --border: rgba(255,255,255,0.08); --border-mid: rgba(255,255,255,0.14);
    --text: #e8e8e8; --muted: #888; --faint: #555;
    --green: #4ade80; --green-bg: #0f2d1a;
    --blue: #60a5fa; --blue-bg: #0c1e35;
    --amber: #fbbf24; --amber-bg: #2a1a00;
    --red: #f87171; --red-bg: #2d0f0f;
    --purple: #c084fc; --purple-bg: rgba(192,132,252,0.1); --purple-border: rgba(192,132,252,0.28);
    --success: #4ade80; --success-bg: #0a2018;
    --danger: #f87171; --danger-bg: #2a0d0d;
  }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; padding: 1rem; }
  #app { max-width: 700px; margin: 0 auto; }
  input, button, textarea { font-family: inherit; }
  input { background: var(--surface); border: 0.5px solid var(--border-mid); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 13px; outline: none; width: 100%; }
  input:focus { border-color: rgba(255,255,255,0.3); }
  input::placeholder { color: var(--faint); }
  button { cursor: pointer; font-size: 13px; }
  .btn { background: var(--surface); border: 0.5px solid var(--border-mid); border-radius: 6px; color: var(--text); padding: 7px 14px; }
  .btn:hover { background: var(--surface-hover); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-green { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .btn-danger { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .btn-icon { background: none; border: none; color: var(--faint); padding: 2px 4px; border-radius: 4px; display: flex; align-items: center; }
  .btn-icon:hover { color: var(--muted); }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .header-title { font-size: 14px; font-weight: 500; }
  .sync-status { font-size: 11px; color: var(--faint); }
  .sync-status.saving { color: var(--amber); }
  .sync-status.error { color: var(--danger); }

  .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .input-row input { flex: 1; }

  .msg { margin-bottom: 12px; font-size: 12px; padding: 8px 12px; border-radius: 8px; }
  .msg.success { background: var(--success-bg); color: var(--success); }
  .msg.error { background: var(--danger-bg); color: var(--danger); }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat-card { background: var(--surface); border-radius: 8px; padding: 12px 14px; border: 0.5px solid var(--border); }
  .stat-label { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
  .stat-val { font-size: 22px; font-weight: 500; }

  .paper-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 20px; padding: 10px 14px; background: var(--purple-bg); border: 0.5px solid var(--purple-border); border-radius: 8px; }
  .paper-stat-label { font-size: 10px; color: var(--purple); opacity: 0.85; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
  .paper-stat-val { font-size: 16px; font-weight: 500; color: var(--purple); }

  .tabs-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--border); }
  .tabs { display: flex; }
  .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 16px 8px 0; font-size: 13px; color: var(--muted); margin-bottom: -1px; }
  .tab-btn.active { border-bottom-color: var(--text); color: var(--text); font-weight: 500; }
  .filter-btns { display: flex; gap: 4px; padding-bottom: 6px; }
  .filter-btn { background: transparent; border: 0.5px solid transparent; border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--faint); }
  .filter-btn.active { background: var(--surface); border-color: var(--border-mid); color: var(--text); }

  .trade-list { border: 0.5px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; margin-bottom: 14px; }
  .empty { padding: 2.5rem; text-align: center; color: var(--faint); font-size: 13px; }

  .trade-row { border-bottom: 0.5px solid var(--border); }
  .trade-row:last-child { border-bottom: none; }
  .trade-row-inner { padding: 10px 12px; cursor: pointer; }
  .trade-row-inner:hover, .trade-row-inner.expanded { background: var(--surface-hover); }

  .trade-line1 { display: flex; align-items: center; gap: 8px; }
  .trade-line2 { display: none; }
  .trade-ticker { font-weight: 500; font-size: 15px; white-space: nowrap; }
  .trade-strike { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .trade-expiry { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .trade-dte { font-size: 13px; white-space: nowrap; }
  .trade-premium { font-size: 14px; color: var(--text); white-space: nowrap; }
  .trade-pnl { font-size: 14px; font-weight: 500; white-space: nowrap; }
  .trade-spacer { flex: 1; }

  .trade-detail { margin: 6px 0 4px; padding-top: 10px; border-top: 0.5px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 5px 20px; font-size: 13px; color: var(--muted); }
  .trade-detail .full { grid-column: 1 / -1; }
  .detail-highlight { color: var(--text); font-weight: 500; }

  .note-row { grid-column: 1/-1; margin-top: 4px; }
  .note-add-btn { background: none; border: 0.5px solid var(--border-mid); border-radius: 4px; padding: 2px 8px; color: var(--faint); font-size: 11px; }
  .note-add-btn:hover { color: var(--muted); }
  .note-input { background: var(--bg); border: 0.5px solid var(--border-mid); border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 12px; width: 100%; resize: none; outline: none; line-height: 1.5; }
  .note-input:focus { border-color: rgba(255,255,255,0.3); }
  .note-input::placeholder { color: var(--faint); }
  .note-save-btn { margin-top: 5px; background: none; border: 0.5px solid var(--border-mid); border-radius: 4px; padding: 2px 10px; color: var(--muted); font-size: 11px; }
  .note-save-btn:hover { color: var(--text); }

  .badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .badge-paper { background: var(--purple-bg); color: var(--purple); border: 0.5px solid var(--purple-border); font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
  .badge-open { background: var(--green-bg); color: var(--green); }
  .badge-expired { background: var(--blue-bg); color: var(--blue); }
  .badge-boughtback { background: var(--amber-bg); color: var(--amber); }
  .badge-assigned { background: var(--red-bg); color: var(--red); }

  .close-btn { background: none; border: 0.5px solid var(--border-mid); border-radius: 4px; padding: 2px 8px; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .close-btn:hover { border-color: var(--amber); color: var(--amber); }
  .trash-btn { background: none; border: none; color: var(--faint); padding: 2px 4px; border-radius: 4px; display: flex; align-items: center; }
  .trash-btn:hover { color: var(--danger); }
  .edit-btn { background: none; border: none; color: var(--faint); padding: 2px 4px; border-radius: 4px; display: flex; align-items: center; }
  .edit-btn:hover { color: var(--blue); }
  .confirm-delete { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .confirm-label { color: var(--muted); white-space: nowrap; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: var(--surface); border: 0.5px solid var(--border-mid); border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 420px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title { font-size: 14px; font-weight: 500; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 0 4px; }
  .modal-body { display: flex; flex-direction: column; gap: 12px; }
  .field-label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  .paper-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .paper-toggle input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--purple); cursor: pointer; }

  .export-section { margin-top: 16px; border-top: 0.5px solid var(--border); padding-top: 14px; }
  .export-toggle { background: none; border: none; color: var(--faint); font-size: 12px; padding: 0; display: flex; align-items: center; gap: 5px; }
  .export-toggle:hover { color: var(--muted); }
  .export-box { margin-top: 10px; }
  .export-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .export-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .export-actions { display: flex; gap: 6px; }
  .export-pre { font-family: monospace; font-size: 12px; background: var(--bg); border: 0.5px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); white-space: pre-wrap; line-height: 1.8; }

  .hint { font-size: 12px; color: var(--faint); line-height: 1.8; margin-bottom: 4px; }
  .hint-label { font-size: 11px; color: var(--muted); font-weight: 500; display: block; margin-bottom: 2px; }
  .hint-eg { color: var(--muted); }

  .screen { min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 3rem; }
  .screen-error { color: var(--danger); font-size: 14px; }
  .screen-sub { color: var(--faint); font-size: 12px; font-family: monospace; }
  .screen-note { color: var(--faint); font-size: 12px; }

  @media (max-width: 520px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .paper-stats { grid-template-columns: 1fr 1fr; }
    .trade-detail { grid-template-columns: 1fr; }
    .trade-line1 { gap: 6px; }
    .trade-line2 { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .line1-close { display: none; }
    .line1-badges { display: none; }
    .line1-pnl { display: none; }
  }
  @media (min-width: 521px) {
    .trade-line2 { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const BIN_ID = "6a0274c1c0954111d80ced85";
const API_KEY = "$2a$10$ajzOQLVYpqbSmeW1nxJEyer0G9YwuMcM7vLIEBb69iRxGoomhu9NS";
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

let trades = [];
let loadStatus = "loading";
let loadError = null;
let saving = false;
let saveError = false;
let msg = null;
let tab = "open";
let filter = "all";
let expandedId = null;
let showNoteId = null;
let showExport = false;
let closeTarget = null;
let editTarget = null;   // trade being edited
let showAddModal = false;
let expiredQueue = [];
let expiredIdx = 0;
let confirmDeleteId = null;
let batchStatus = null;

async function loadBin() {
  const r = await fetch(BIN_URL + "/latest", { headers: { "X-Access-Key": API_KEY } });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const data = await r.json();
  const rec = data.record;
  if (Array.isArray(rec)) return rec.filter(t => !t.init);
  return [];
}

async function saveBin(t) {
  const r = await fetch(BIN_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Access-Key": API_KEY },
    body: JSON.stringify(t)
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
}

function parseExpiry(s) {
  const parts = s.split("/");
  if (parts.length < 2) return null;
  const mm = parseInt(parts[0], 10), dd = parseInt(parts[1], 10);
  const yyyy = parts[2] ? parseInt(parts[2], 10) : null;
  if (yyyy) return `${yyyy}-${pad(mm)}-${pad(dd)}`;
  const now = new Date(); let year = now.getFullYear();
  if (new Date(year, mm - 1, dd) <= now) year++;
  return `${year}-${pad(mm)}-${pad(dd)}`;
}

function parseRoll(str) {
  if (!str?.trim()) return null;
  const tokens = str.trim().split(/\s+/);
  if (tokens.length < 3) return null;
  const strike = parseFloat(tokens[0].replace(/[$c@]/gi, ""));
  const expiry = parseExpiry(tokens[1]);
  const premium = parseFloat(tokens[2].replace(/[$@]/g, ""));
  let contracts = null;
  for (const t of tokens.slice(3)) { const m = t.match(/^x(\d+)$/i); if (m) contracts = parseInt(m[1]); }
  if (isNaN(strike) || !expiry || isNaN(premium)) return null;
  return { strike, expiry, premium, contracts };
}

function parseClose(tokens) {
  if (tokens.length < 4) return { error: "Need: CLOSE TICKER STRIKE MM/DD PRICE" };
  const ticker = tokens[0].toUpperCase();
  const strike = parseFloat(tokens[1].replace(/[$c@]/gi, ""));
  if (isNaN(strike)) return { error: `Bad strike: ${tokens[1]}` };
  const expiry = parseExpiry(tokens[2]);
  if (!expiry) return { error: `Bad date: ${tokens[2]}` };
  let priceStr = tokens[3], rest = tokens.slice(4);
  if (/^at$/i.test(priceStr)) { if (!tokens[4]) return { error: "Missing price after 'at'" }; priceStr = tokens[4]; rest = tokens.slice(5); }
  const closePrice = parseFloat(priceStr.replace(/[$@]/g, ""));
  if (isNaN(closePrice) || closePrice < 0) return { error: `Bad price: ${priceStr}` };
  let status = "BOUGHT BACK";
  for (const t of rest) {
    if (/^expired$/i.test(t)) { status = "EXPIRED"; break; }
    if (/^assigned$/i.test(t)) { status = "ASSIGNED"; break; }
  }
  if (closePrice === 0 && status === "BOUGHT BACK") status = "EXPIRED";
  return { ticker, strike, expiry, closePrice, status, error: null };
}

function parseTrade(raw) {
  const tokens = raw.trim().split(/\s+/).map(s => s.replace(/[$@]/g, "")).filter(s => s && !/^at$/i.test(s));
  if (tokens.length < 4) return { error: "Need: TICKER STRIKE MM/DD PREMIUM [xN] [paper]" };
  const ticker = tokens[0].toUpperCase();
  const strike = parseFloat(tokens[1].replace(/c$/i, ""));
  if (isNaN(strike)) return { error: `Bad strike: ${tokens[1]}` };
  const expiry = parseExpiry(tokens[2]);
  if (!expiry) return { error: `Bad date: ${tokens[2]}` };
  const premium = parseFloat(tokens[3]);
  if (isNaN(premium)) return { error: `Bad premium: ${tokens[3]}` };
  let contracts = 1, paper = false;
  for (const t of tokens.slice(4)) {
    const m = t.match(/^x(\d+)$/i);
    if (m) { contracts = parseInt(m[1]); continue; }
    if (/^paper$/i.test(t)) paper = true;
  }
  return { ticker, strike, expiry, premium, contracts, paper, error: null };
}

const pad = n => String(n).padStart(2, "0");
const today = () => new Date().toISOString().slice(0, 10);
const dte = exp => { if (!exp) return null; const now = new Date(); now.setHours(0,0,0,0); return Math.round((new Date(exp+"T00:00:00") - now) / 86400000); };
const daysHeld = (openDate, closeDate) => { if (!openDate) return null; const end = closeDate || today(); const diff = Math.round((new Date(end) - new Date(openDate)) / 86400000); return diff >= 0 ? diff : null; };
const isExpiredTrade = t => t.status === "OPEN" && dte(t.expiry) !== null && dte(t.expiry) < 0;
const fmt$ = n => n == null || isNaN(n) ? "—" : (n >= 0 ? "+" : "-") + "$" + Math.abs(n).toFixed(0);
const fmtP = n => n == null || isNaN(n) ? "—" : "$" + Number(n).toFixed(2);
const shortDate = s => s ? s.slice(5).replace("-", "/") : "";
const mmdd = shortDate;
const dteColor = d => d == null ? "var(--faint)" : d <= 5 ? "var(--red)" : d <= 14 ? "var(--amber)" : "var(--faint)";

function sortedOpen(arr) {
  const real = arr.filter(t => !t.paper).sort((a,b) => (a.expiry||"").localeCompare(b.expiry||""));
  const paper = arr.filter(t => t.paper).sort((a,b) => (a.expiry||"").localeCompare(b.expiry||""));
  return [...real, ...paper];
}

function badgeHTML(status, paper) {
  const map = { OPEN: "open", EXPIRED: "expired", "BOUGHT BACK": "boughtback", ASSIGNED: "assigned" };
  return (paper ? `<span class="badge-paper">paper</span>` : "") + `<span class="badge badge-${map[status]||"open"}">${status.toLowerCase()}</span>`;
}

function showMsg(type, text) {
  msg = { type, text }; render();
  setTimeout(() => { if (msg?.text === text) { msg = null; render(); } }, 5000);
}

function trashSVG() {
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>`;
}

function editSVG() {
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
}

function exportData() {
  const lines = [];
  for (const t of trades) {
    const p = t.paper ? " paper" : "", cx = t.contracts > 1 ? ` x${t.contracts}` : "";
    lines.push(`OPEN ${t.ticker} ${t.strike} ${mmdd(t.expiry)} ${t.premium}${cx}${p}`);
    if (t.status !== "OPEN") {
      const cp = t.closePrice != null ? Number(t.closePrice).toFixed(2) : "0.00";
      lines.push(`CLOSE ${t.ticker} ${t.strike} ${mmdd(t.closeDate||t.expiry)} at $${cp}${p}`);
    }
  }
  return lines.join("\n");
}

async function persist(next) {
  trades = next; saving = true; saveError = false; render();
  try { await saveBin(next); } catch { saveError = true; showMsg("error", "Save failed — data safe locally but not synced."); }
  saving = false; render(); return next;
}

// ── Add/Edit modal submit ────────────────────────────────────────────────────
function getModalFields(prefix) {
  const ticker = document.getElementById(`${prefix}-ticker`)?.value?.trim().toUpperCase();
  const strikeRaw = document.getElementById(`${prefix}-strike`)?.value?.trim().replace(/[$c@]/gi,"");
  const strike = parseFloat(strikeRaw);
  const dateRaw = document.getElementById(`${prefix}-date`)?.value?.trim();
  const expiry = dateRaw ? parseExpiry(dateRaw) : null;
  const premium = parseFloat(document.getElementById(`${prefix}-premium`)?.value?.trim());
  const contracts = parseInt(document.getElementById(`${prefix}-contracts`)?.value?.trim()) || 1;
  const paper = document.getElementById(`${prefix}-paper`)?.checked || false;
  return { ticker, strike, expiry, premium, contracts, paper };
}

function validateModalFields(fields, errId) {
  const { ticker, strike, expiry, premium, contracts } = fields;
  if (!ticker) { document.getElementById(errId).textContent = "Ticker required"; return false; }
  if (isNaN(strike) || strike <= 0) { document.getElementById(errId).textContent = "Invalid strike"; return false; }
  if (!expiry) { document.getElementById(errId).textContent = "Invalid date — use MM/DD or MM/DD/YYYY"; return false; }
  if (isNaN(premium) || premium < 0) { document.getElementById(errId).textContent = "Invalid premium"; return false; }
  if (isNaN(contracts) || contracts < 1) { document.getElementById(errId).textContent = "Invalid contracts"; return false; }
  return true;
}

async function handleAddConfirm() {
  const fields = getModalFields("add");
  if (!validateModalFields(fields, "add-error")) return;
  const t = { id: String(Date.now()), ticker: fields.ticker, strike: fields.strike, expiry: fields.expiry, premium: fields.premium, contracts: fields.contracts, paper: fields.paper, status: "OPEN", openDate: today(), closePrice: null, pnl: null, note: "" };
  showAddModal = false;
  await persist([t, ...trades]);
  showMsg("success", `Logged: ${t.ticker} $${t.strike} · ${shortDate(t.expiry)} · ${fmtP(t.premium)}${t.paper?" (paper)":""}`);
  tab = "open";
}

async function handleEditConfirm() {
  const t = editTarget; if (!t) return;
  const fields = getModalFields("edit");
  if (!validateModalFields(fields, "edit-error")) return;
  const updated = { ...t, ticker: fields.ticker, strike: fields.strike, expiry: fields.expiry, premium: fields.premium, contracts: fields.contracts, paper: fields.paper };
  editTarget = null;
  await persist(trades.map(x => x.id === t.id ? updated : x));
  showMsg("success", `Updated: ${updated.ticker} $${updated.strike} · ${shortDate(updated.expiry)}`);
}

// ── Log line ─────────────────────────────────────────────────────────────────
async function handleLog() {
  const raw = document.getElementById("trade-input")?.value?.trim();
  if (!raw) return;
  const parts = raw.split(",").map(s => s.trim()).filter(Boolean);
  if (parts.length === 1) {
    await processSingle(parts[0]);
    document.getElementById("trade-input").value = "";
  } else {
    document.getElementById("trade-input").value = "";
    let current = [...trades], added = 0, closed = 0;
    const failed = [];
    for (let i = 0; i < parts.length; i++) {
      batchStatus = `Processing ${i+1} of ${parts.length}…`; render();
      const result = processPart(parts[i], current);
      if (result.error) { failed.push(parts[i]); continue; }
      current = result.trades;
      if (result.type === "add") added++;
      if (result.type === "close") closed++;
    }
    batchStatus = null;
    await persist(current);
    const s = [];
    if (added) s.push(`${added} logged`);
    if (closed) s.push(`${closed} closed`);
    if (failed.length) s.push(`${failed.length} failed`);
    showMsg(added === 0 && closed === 0 ? "error" : "success", s.join(" · "));
    if (added) { tab = "open"; render(); }
  }
}

async function processSingle(raw) {
  const tokens = raw.trim().split(/\s+/);
  if (/^CLOSE$/i.test(tokens[0])) {
    const result = parseClose(tokens.slice(1));
    if (result.error) { showMsg("error", result.error); return; }
    const match = trades.find(t => t.status === "OPEN" && t.ticker === result.ticker && Math.abs(t.strike - result.strike) < 0.01 && t.expiry === result.expiry);
    if (!match) { showMsg("error", `No open position: ${result.ticker} $${result.strike} ${result.expiry}`); return; }
    const pnl = (match.premium - result.closePrice) * match.contracts * 100;
    await persist(trades.map(t => t.id === match.id ? { ...t, status: result.status, closePrice: result.closePrice, pnl, closeDate: today() } : t));
    showMsg("success", `Closed ${match.ticker} · ${result.status} · P&L: ${fmt$(pnl)}`);
  } else {
    const src = /^OPEN$/i.test(tokens[0]) ? tokens.slice(1).join(" ") : raw;
    const result = parseTrade(src);
    if (result.error) { showMsg("error", result.error); return; }
    const t = { id: String(Date.now()), ticker: result.ticker, strike: result.strike, expiry: result.expiry, premium: result.premium, contracts: result.contracts, paper: result.paper, status: "OPEN", openDate: today(), closePrice: null, pnl: null, note: "" };
    await persist([t, ...trades]);
    showMsg("success", `Logged: ${t.ticker} $${t.strike} · ${shortDate(t.expiry)} · ${fmtP(t.premium)}${t.paper?" (paper)":""}`);
    tab = "open"; render();
  }
}

function processPart(raw, currentTrades) {
  const tokens = raw.trim().split(/\s+/);
  if (/^CLOSE$/i.test(tokens[0])) {
    const result = parseClose(tokens.slice(1));
    if (result.error) return { error: result.error };
    const match = currentTrades.find(t => t.status === "OPEN" && t.ticker === result.ticker && Math.abs(t.strike - result.strike) < 0.01 && t.expiry === result.expiry);
    if (!match) return { error: `No open: ${result.ticker}` };
    const pnl = (match.premium - result.closePrice) * match.contracts * 100;
    return { trades: currentTrades.map(t => t.id === match.id ? { ...t, status: result.status, closePrice: result.closePrice, pnl, closeDate: today() } : t), type: "close" };
  } else {
    const src = /^OPEN$/i.test(tokens[0]) ? tokens.slice(1).join(" ") : raw;
    const result = parseTrade(src);
    if (result.error) return { error: result.error };
    const t = { id: String(Date.now() + Math.random()), ticker: result.ticker, strike: result.strike, expiry: result.expiry, premium: result.premium, contracts: result.contracts, paper: result.paper, status: "OPEN", openDate: today(), closePrice: null, pnl: null, note: "" };
    return { trades: [t, ...currentTrades], type: "add" };
  }
}

async function handleDelete(id) {
  const next = trades.filter(t => t.id !== id);
  if (expandedId === id) expandedId = null;
  confirmDeleteId = null;
  await persist(next); showMsg("success", "Deleted.");
}

async function saveNote(id) {
  const val = document.getElementById(`note-input-${id}`)?.value || "";
  const next = trades.map(t => t.id === id ? { ...t, note: val } : t);
  showNoteId = null;
  await persist(next);
  showMsg("success", "Note saved.");
}

function handleCloseConfirm() {
  const t = closeTarget;
  const cp = parseFloat(document.getElementById("close-price")?.value);
  if (isNaN(cp) || cp < 0) { document.getElementById("close-error").textContent = "Enter a valid close price (0 for worthless)"; return; }
  const cval = document.getElementById("close-contracts")?.value?.trim();
  const closingC = cval ? parseInt(cval) : t.contracts;
  if (isNaN(closingC) || closingC < 1 || closingC > t.contracts) { document.getElementById("close-error").textContent = `Contracts must be 1–${t.contracts}`; return; }
  const rollStr = document.getElementById("close-roll")?.value?.trim();
  const roll = rollStr ? parseRoll(rollStr) : null;
  if (rollStr && !roll) { document.getElementById("close-error").textContent = "Bad roll — use: STRIKE MM/DD PREMIUM [xN]"; return; }
  const pnl = (t.premium - cp) * closingC * 100;
  let next = trades;
  if (closingC < t.contracts) {
    next = next.map(x => x.id === t.id ? { ...x, contracts: t.contracts - closingC } : x);
    next = [{ ...t, id: String(Date.now()), contracts: closingC, status: "BOUGHT BACK", closePrice: cp, pnl, closeDate: today() }, ...next];
  } else {
    next = next.map(x => x.id === t.id ? { ...x, status: "BOUGHT BACK", closePrice: cp, pnl, closeDate: today() } : x);
  }
  if (roll) {
    const rc = roll.contracts || closingC;
    next = [{ id: String(Date.now()+1), ticker: t.ticker, strike: roll.strike, expiry: roll.expiry, premium: roll.premium, contracts: rc, paper: t.paper, status: "OPEN", openDate: today(), closePrice: null, pnl: null, note: "" }, ...next];
  }
  persist(next);
  showMsg("success", `Closed ${t.ticker}${roll?` · rolled to $${roll.strike} ${shortDate(roll.expiry)}`:""} · P&L: ${fmt$(pnl)}`);
  closeTarget = null; render();
}

function handleExpiryConfirm(worthless) {
  const t = expiredQueue[expiredIdx]; if (!t) return;
  let cp = 0;
  if (!worthless) {
    cp = parseFloat(document.getElementById("expiry-price")?.value);
    if (isNaN(cp) || cp < 0) { document.getElementById("expiry-error").textContent = "Enter a valid price"; return; }
  }
  const pnl = (t.premium - cp) * t.contracts * 100;
  const status = cp === 0 ? "EXPIRED" : "BOUGHT BACK";
  persist(trades.map(x => x.id === t.id ? { ...x, status, closePrice: cp, pnl, closeDate: today() } : x));
  showMsg("success", `${t.ticker} marked ${status} · P&L: ${fmt$(pnl)}`);
  expiredIdx++; render();
}

function downloadTxt() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([exportData()], { type: "text/plain" }));
  a.download = "covered_calls.txt"; a.click();
}

async function refreshExport() {
  const btn = document.getElementById("export-refresh-btn");
  if (btn) { btn.textContent = "Refreshing…"; btn.disabled = true; }
  try { trades = await loadBin(); showMsg("success", "Refreshed."); }
  catch { showMsg("error", "Refresh failed."); }
  render();
}

// ── Trade/Add/Edit modal HTML builders ───────────────────────────────────────
function entryModalHTML(prefix, title, t, onConfirm, onCancel) {
  const val = (field, fallback="") => t ? (t[field] != null ? t[field] : fallback) : fallback;
  const dateVal = t?.expiry ? shortDate(t.expiry) : "";
  return `<div class="modal-overlay"><div class="modal">
    <div class="modal-header">
      <span class="modal-title">${title}</span>
      <button class="modal-close" onclick="${onCancel}">×</button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="field-label">Ticker</label><input id="${prefix}-ticker" placeholder="MRVL" value="${val("ticker")}" style="text-transform:uppercase"/></div>
        <div><label class="field-label">Strike</label><input id="${prefix}-strike" placeholder="185" value="${val("strike")}"/></div>
        <div><label class="field-label">Expiry (MM/DD or MM/DD/YYYY)</label><input id="${prefix}-date" placeholder="06/18" value="${dateVal}"/></div>
        <div><label class="field-label">Premium</label><input id="${prefix}-premium" placeholder="9.11" value="${val("premium")}"/></div>
        <div><label class="field-label">Contracts</label><input id="${prefix}-contracts" placeholder="1" value="${val("contracts", 1)}" type="number" min="1"/></div>
        <div style="display:flex;align-items:flex-end;padding-bottom:2px">
          <label class="paper-toggle"><input type="checkbox" id="${prefix}-paper" ${val("paper") ? "checked" : ""}/> Paper trade</label>
        </div>
      </div>
      <div id="${prefix}-error" style="font-size:12px;color:var(--danger);min-height:16px"></div>
      <div class="modal-actions">
        <button class="btn" onclick="${onCancel}">Cancel</button>
        <button class="btn btn-green" onclick="${onConfirm}">Confirm</button>
      </div>
    </div>
  </div></div>`;
}

function tradeRowHTML(t) {
  const d = dte(t.expiry);
  const dc = dteColor(d);
  const pnlColor = t.paper ? "var(--purple)" : (t.pnl||0) >= 0 ? "var(--success)" : "var(--danger)";
  const tickerColor = t.paper ? "var(--purple)" : "var(--text)";
  const isExpanded = expandedId === t.id;
  const isConfirm = confirmDeleteId === t.id;
  const showNote = showNoteId === t.id;
  const dteHTML = t.status === "OPEN" && d != null ? `<span class="trade-dte" style="color:${dc}">${d}d</span>` : "";
  const pnlHTML = t.pnl != null ? `<span class="trade-pnl" style="color:${pnlColor}">${fmt$(t.pnl)}${t.paper?" (sim)":""}</span>` : "";
  const closeHTML = t.status === "OPEN" ? `<button class="close-btn" onclick="event.stopPropagation();closeTarget=trades.find(x=>x.id==='${t.id}');render()">close</button>` : "";

  const actionBtns = isConfirm
    ? `<span class="confirm-delete" onclick="event.stopPropagation()"><span class="confirm-label">Delete?</span><button class="btn btn-danger" style="padding:2px 8px;font-size:12px" onclick="handleDelete('${t.id}')">Yes</button><button class="btn" style="padding:2px 8px;font-size:12px" onclick="confirmDeleteId=null;render()">No</button></span>`
    : `<button class="edit-btn" onclick="event.stopPropagation();editTarget=trades.find(x=>x.id==='${t.id}');render()" title="Edit">${editSVG()}</button><button class="trash-btn" onclick="event.stopPropagation();confirmDeleteId='${t.id}';render()" title="Delete">${trashSVG()}</button>`;

  const breakeven = (Number(t.strike) + Number(t.premium)).toFixed(2);
  const held = daysHeld(t.openDate, t.closeDate);

  let noteHTML = "";
  if (showNote) {
    noteHTML = `<div class="note-row" onclick="event.stopPropagation()">
      <textarea id="note-input-${t.id}" class="note-input" rows="2" placeholder="Add a note…">${t.note||""}</textarea>
      <button class="note-save-btn" onclick="event.stopPropagation();saveNote('${t.id}')">Save</button>
    </div>`;
  } else if (t.note) {
    noteHTML = `<div class="full" style="color:var(--faint);font-size:12px">${t.note} <button class="note-add-btn" onclick="event.stopPropagation();showNoteId='${t.id}';render()" style="margin-left:6px">edit</button></div>`;
  } else {
    noteHTML = `<div class="note-row"><button class="note-add-btn" onclick="event.stopPropagation();showNoteId='${t.id}';render()">+ add note</button></div>`;
  }

  const detailHTML = isExpanded ? `<div class="trade-detail">
    <span>Premium: ${fmtP(t.premium)}</span>
    <span>Contracts: ${t.contracts}</span>
    <span>Total credit: $${(t.premium * t.contracts * 100).toFixed(0)}${t.paper?" (paper)":""}</span>
    <span>Opened: ${t.openDate}</span>
    ${t.closeDate ? `<span>Closed: ${t.closeDate}</span>` : ""}
    ${held != null ? `<span>Days held: ${held}</span>` : ""}
    ${t.closePrice != null && t.status !== "OPEN" ? `<span>Close price: ${fmtP(t.closePrice)}</span>` : ""}
    <span class="full detail-highlight">Breakeven: $${breakeven}</span>
    ${t.status === "ASSIGNED" ? `<span class="full detail-highlight">Effective sale: $${breakeven}</span>` : ""}
    ${noteHTML}
  </div>` : "";

  return `<div class="trade-row">
    <div class="trade-row-inner${isExpanded?" expanded":""}" onclick="expandedId=expandedId==='${t.id}'?null:'${t.id}';if(showNoteId&&showNoteId!=='${t.id}')showNoteId=null;render()">
      <div class="trade-line1">
        <span class="trade-ticker" style="color:${tickerColor}">${t.ticker}</span>
        <span class="trade-strike">$${t.strike}</span>
        <span class="trade-expiry">${shortDate(t.expiry)}</span>
        ${dteHTML}
        <span class="trade-premium">${fmtP(t.premium)}</span>
        <span class="trade-spacer"></span>
        <span class="line1-pnl">${pnlHTML}</span>
        <span class="line1-close">${closeHTML}</span>
        <span class="line1-badges">${badgeHTML(t.status, t.paper)}</span>
        ${actionBtns}
      </div>
      <div class="trade-line2">
        ${closeHTML}
        ${pnlHTML}
        ${badgeHTML(t.status, t.paper)}
      </div>
      ${detailHTML}
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById("app");
  if (loadStatus === "loading") { app.innerHTML = `<div class="screen"><div style="color:var(--muted)">Loading trades…</div></div>`; return; }
  if (loadStatus === "error") { app.innerHTML = `<div class="screen"><div class="screen-error">Couldn't load trades</div>${loadError?`<div class="screen-sub">${loadError}</div>`:""}<div class="screen-note">Check your connection and try again</div><button class="btn" onclick="attemptLoad()">Retry</button></div>`; return; }

  const open = sortedOpen(trades.filter(t => t.status === "OPEN"));
  const closed = trades.filter(t => t.status !== "OPEN");
  const rOpen = open.filter(t => !t.paper), pOpen = open.filter(t => t.paper);
  const rClosed = closed.filter(t => !t.paper), pClosed = closed.filter(t => t.paper);
  const rPrem = rOpen.reduce((s,t) => s+t.premium*t.contracts*100, 0);
  const rPnl = rClosed.reduce((s,t) => s+(t.pnl||0), 0);
  const rWins = rClosed.filter(t => (t.pnl||0)>0).length;
  const rWR = rClosed.length ? Math.round(rWins/rClosed.length*100) : null;
  const pPrem = pOpen.reduce((s,t) => s+t.premium*t.contracts*100, 0);
  const pPnl = pClosed.reduce((s,t) => s+(t.pnl||0), 0);
  const pWins = pClosed.filter(t => (t.pnl||0)>0).length;
  const pWR = pClosed.length ? Math.round(pWins/pClosed.length*100) : null;
  const hasPaper = pOpen.length > 0 || pClosed.length > 0;

  const applyFilter = arr => filter==="real"?arr.filter(t=>!t.paper):filter==="paper"?arr.filter(t=>t.paper):arr;
  const displayed = applyFilter(tab==="open" ? open : closed);
  const rowsHTML = displayed.length === 0 ? `<div class="empty">No trades here yet.</div>` : displayed.map(tradeRowHTML).join("");

  const exportHTML = showExport ? `<div class="export-box">
    <div class="export-header">
      <span class="export-label">Export</span>
      <div class="export-actions">
        <button class="btn" id="export-refresh-btn" onclick="refreshExport()">↻ Refresh</button>
        <button class="btn" onclick="downloadTxt()">.txt</button>
        <button class="btn" onclick="showExport=false;render()">Close</button>
      </div>
    </div>
    <pre class="export-pre">${exportData()||"No trades yet."}</pre>
  </div>` : "";

  const addModalHTML = showAddModal
    ? entryModalHTML("add", "Add trade", null, "handleAddConfirm()", "showAddModal=false;render()")
    : "";

  const editModalHTML = editTarget
    ? entryModalHTML("edit", `Edit ${editTarget.ticker} $${editTarget.strike}`, editTarget, "handleEditConfirm()", "editTarget=null;render()")
    : "";

  const closeModalHTML = closeTarget ? (() => { const t = closeTarget; return `<div class="modal-overlay"><div class="modal">
    <div class="modal-header"><span class="modal-title">Close ${t.ticker} $${t.strike} · ${shortDate(t.expiry)}</span><button class="modal-close" onclick="closeTarget=null;render()">×</button></div>
    <div class="modal-body">
      <div><label class="field-label">Close price (0 = expired worthless)</label><input id="close-price" placeholder="e.g. 0.45" autofocus onkeydown="if(event.key==='Enter')handleCloseConfirm()"/></div>
      <div><label class="field-label">Contracts to close (default: all ${t.contracts})</label><input id="close-contracts" placeholder="1–${t.contracts}"/></div>
      <div><label class="field-label">Roll over (optional) — STRIKE MM/DD PREMIUM [xN]</label><input id="close-roll" placeholder="${t.strike} ${shortDate(t.expiry)} ${t.premium}"/></div>
      <div id="close-error" style="font-size:12px;color:var(--danger);min-height:16px"></div>
      <div class="modal-actions"><button class="btn" onclick="closeTarget=null;render()">Cancel</button><button class="btn btn-green" onclick="handleCloseConfirm()">Confirm</button></div>
    </div>
  </div></div>`; })() : "";

  const expiryModalHTML = (expiredQueue.length > 0 && expiredIdx < expiredQueue.length) ? (() => { const t = expiredQueue[expiredIdx]; return `<div class="modal-overlay"><div class="modal">
    <div class="modal-header"><span class="modal-title">Expired ${expiredIdx+1} of ${expiredQueue.length}</span></div>
    <div class="modal-body">
      <div style="font-size:14px"><span style="font-weight:500;color:${t.paper?"var(--purple)":"var(--text)"}">${t.ticker}</span> <span style="color:var(--muted)">$${t.strike} · ${shortDate(t.expiry)}${t.paper?" (paper)":""}</span></div>
      <div style="font-size:12px;color:var(--amber)">Expired ${shortDate(t.expiry)} — how did it close?</div>
      <div><label class="field-label">Close price</label><input id="expiry-price" placeholder="0 or amount" autofocus onkeydown="if(event.key==='Enter')handleExpiryConfirm(false)"/></div>
      <div id="expiry-error" style="font-size:12px;color:var(--danger);min-height:16px"></div>
      <div class="modal-actions"><button class="btn btn-green" onclick="handleExpiryConfirm(true)">Expired Worthless</button><button class="btn" onclick="handleExpiryConfirm(false)">Confirm Price</button></div>
    </div>
  </div></div>`; })() : "";

  const syncText = saving?"⟳ Saving…":saveError?"⚠ Save failed":"✓ Synced";

  app.innerHTML = `
    ${addModalHTML}${editModalHTML}${closeModalHTML}${expiryModalHTML}
    <div class="header">
      <span class="header-title">Covered Calls</span>
      <span class="sync-status${saving?" saving":saveError?" error":""}">${syncText}</span>
    </div>
    <div class="input-row">
      <input id="trade-input" placeholder="TICKER STRIKE MM/DD PREMIUM [xN] [paper]  or  CLOSE TICKER STRIKE MM/DD PRICE" onkeydown="if(event.key==='Enter')handleLog()"/>
      <button class="btn" onclick="showAddModal=true;render()" style="white-space:nowrap">+ Add</button>
      <button class="btn" onclick="handleLog()" ${saving||batchStatus?"disabled":""}>${batchStatus||(saving?"Saving…":"Log")}</button>
    </div>
    ${msg?`<div class="msg ${msg.type}">${msg.text}</div>`:""}
    <div class="stats-grid" style="margin-bottom:${hasPaper?8:20}px">
      <div class="stat-card"><div class="stat-label">Open (real)</div><div class="stat-val">${rOpen.length}</div></div>
      <div class="stat-card"><div class="stat-label">Premium at risk</div><div class="stat-val">$${rPrem.toFixed(0)}</div></div>
      <div class="stat-card"><div class="stat-label">Realized P&L</div><div class="stat-val" style="color:${rPnl>=0?"var(--success)":"var(--danger)"}">${fmt$(rPnl)}</div></div>
      <div class="stat-card"><div class="stat-label">Win rate</div><div class="stat-val">${rWR!=null?rWR+"%":"—"}</div></div>
    </div>
    ${hasPaper?`<div class="paper-stats">
      <div><div class="paper-stat-label">Paper open</div><div class="paper-stat-val">${pOpen.length}</div></div>
      <div><div class="paper-stat-label">Paper premium</div><div class="paper-stat-val">$${pPrem.toFixed(0)}</div></div>
      <div><div class="paper-stat-label">Paper P&L</div><div class="paper-stat-val" style="color:${pPnl>=0?"var(--purple)":"var(--danger)"}">${fmt$(pPnl)}</div></div>
      <div><div class="paper-stat-label">Paper win rate</div><div class="paper-stat-val">${pWR!=null?pWR+"%":"—"}</div></div>
    </div>`:""}
    <div class="tabs-row">
      <div class="tabs">
        <button class="tab-btn${tab==="open"?" active":""}" onclick="tab='open';render()">Open · ${open.length}</button>
        <button class="tab-btn${tab==="closed"?" active":""}" onclick="tab='closed';render()">Closed · ${closed.length}</button>
      </div>
      <div class="filter-btns">
        <button class="filter-btn${filter==="all"?" active":""}" onclick="filter='all';render()">All</button>
        <button class="filter-btn${filter==="real"?" active":""}" onclick="filter='real';render()">Real</button>
        <button class="filter-btn${filter==="paper"?" active":""}" onclick="filter='paper';render()">Paper</button>
      </div>
    </div>
    <div class="trade-list">${rowsHTML}</div>
    <div class="hint">
      <span class="hint-label">Example format (not real trades)</span>
      Open: <span class="hint-eg">MRVL 185c 06/18 9.11 x2</span> · <span class="hint-eg">ASTS 30 05/23 0.85 paper</span><br/>
      Close: <span class="hint-eg">CLOSE MRVL 185 06/18 0.45</span> · Batch: comma-separate multiple
    </div>
    <div class="export-section">
      <button class="export-toggle" onclick="showExport=!showExport;render()">${showExport?"▾":"▸"} Export</button>
      ${exportHTML}
    </div>
  `;
}

function attemptLoad() {
  loadStatus = "loading"; loadError = null; render();
  loadBin()
    .then(data => { trades = data; loadStatus = "ok"; expiredQueue = data.filter(isExpiredTrade); expiredIdx = 0; render(); })
    .catch(e => { loadStatus = "error"; loadError = e.message; render(); });
}

attemptLoad();
</script>
